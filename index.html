<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>へそドロップ</title>
<!-- itch.io のページへ自動で移動 -->
<meta http-equiv="refresh" content="0; url=https://oyaman.itch.io/hesodrop">
<link rel="canonical" href="https://oyaman.itch.io/hesodrop">
<script>location.replace('https://oyaman.itch.io/hesodrop');</script>
<style>
  :root{ --bg:#fff8ec; --text:#12385a; --link:#0a86d6; color-scheme:light; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0e2032; --text:#eaf5ff; --link:#6cc4ff; color-scheme:dark; }
  }
  :root[data-theme="dark"]{ --bg:#0e2032; --text:#eaf5ff; --link:#6cc4ff; color-scheme:dark; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--text);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; box-sizing:border-box;
  }
  a{ color:var(--link); font-weight:700; }
</style>
</head>
<body>
  <p>へそドロップは itch.io に移動しました。<br>
  自動で移動しない場合は <a href="https://oyaman.itch.io/hesodrop">こちら</a> を開いてください。</p>
</body>
</html>
